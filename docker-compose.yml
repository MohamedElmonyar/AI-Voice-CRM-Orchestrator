version: '3.8'

services:
  # --- 1. خدمة قاعدة البيانات (PostgreSQL) ---
  db:
    image: postgres:latest # استخدم أحدث صورة لـ Postgres
    container_name: osv_db # اسم اختياري للكونتينر
    environment:
      # هذه المتغيرات يجب أن تطابق ما في الـ .env file
      POSTGRES_DB: OSV
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # اختياري: لتمكينك من الاتصال بالداتابيز من جهازك
    restart: always

  # --- 2. خدمة التطبيق الخاص بك (كما هي مع تعديل بسيط) ---
  osv-app:
    # Builds the Dockerfile from the current directory
    build: .
    # Sets a friendly name for the image
    image: osv-image:latest
    # Maps port 8080 on the Linux host to port 8080 in the container
    ports:
      - "8080:8080"
    # This is the magic line: it reads the .env file for secrets
    env_file:
      - .env
    # Always restart the container if it stops
    restart: always
    # 💡 تعديل: اجعل التطبيق ينتظر حتى تعمل قاعدة البيانات أولاً
    depends_on:
      - db

# 💡 تعديل: تعريف الـ Volume لضمان حفظ بيانات الداتابيز
volumes:
  postgres_data: {}